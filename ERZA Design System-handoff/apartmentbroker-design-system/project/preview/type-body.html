<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ezra-ink-900); padding: 24px; font-family: var(--ezra-font-body); color: #FFF; }
  .grid { display:grid; grid-template-columns: 110px 1fr; gap: 10px 24px; align-items: baseline; }
  .meta { font-size: 11px; font-weight: 300; letter-spacing: 0.18em; text-transform:uppercase; color: rgba(255,255,255,0.5); }
  .h1 { font-weight: 800; font-size: 38px; letter-spacing: -0.015em; }
  .h2 { font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  .h3 { font-weight: 600; font-size: 20px; }
  .body { font-weight: 300; font-size: 16px; line-height: 1.5; }
  .ebw { font-size: 11px; font-weight: 300; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.85); }
</style></head><body>
<div class="grid">
  <span class="meta">H1</span><span class="h1">Departamentos curados</span>
  <span class="meta">H2</span><span class="h2">Roma Norte · 12 publicaciones</span>
  <span class="meta">H3</span><span class="h3">Hamburgo · piso 4</span>
  <span class="meta">Body</span><span class="body">Departamento amueblado de 60 m², estilo hotel boutique, mantenimiento y servicios incluidos.</span>
  <span class="meta">Eyebrow</span><span class="ebw">Disponible · Col. Juárez</span>
  <span class="meta">Mono</span><span class="mono">MXN $34,500 / mes · 60 m²</span>
</div>
</body></html>
