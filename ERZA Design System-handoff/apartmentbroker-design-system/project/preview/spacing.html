<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .row { display:flex; align-items: center; gap: 14px; padding: 6px 0; }
  .lbl { width: 60px; font: var(--ab-text-mono); font-size: 12px; color: var(--ab-stone-600); }
  .bar { background: var(--ab-terracotta-500); height: 12px; border-radius: 2px; }
  .px { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); }
</style>
</head>
<body>
  <div class="row"><span class="lbl">space-1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
  <div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
  <div class="row"><span class="lbl">space-3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
  <div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
  <div class="row"><span class="lbl">space-5</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
  <div class="row"><span class="lbl">space-6</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
  <div class="row"><span class="lbl">space-7</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
  <div class="row"><span class="lbl">space-8</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
</body></html>
