<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Map pins</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .row { display:flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .pin-price { display:inline-flex; align-items:center; padding: 6px 12px; background: #FFFFFF; border-radius: 999px; box-shadow: var(--ab-shadow-2); font-family: var(--ab-font-mono); font-size: 13px; font-weight: 500; color: var(--ab-ink-900); border: 1px solid var(--ab-border); }
  .pin-price.active { background: var(--ab-terracotta-500); color: #FFFFFF; border-color: var(--ab-terracotta-500); }
  .pin-cluster { width: 36px; height: 36px; border-radius: 999px; background: var(--ab-ink-900); color: #FAF7F2; display:inline-flex; align-items:center; justify-content:center; font-weight: 700; font-size: 13px; box-shadow: var(--ab-shadow-2); }
  .pin-poi { width: 28px; height: 28px; border-radius: 999px; display:inline-flex; align-items:center; justify-content:center; box-shadow: var(--ab-shadow-1); color: #FFFFFF; }
  .lbl { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); margin-right: 4px; }
</style>
</head>
<body>
<div class="row">
  <span class="lbl">Listings</span>
  <span class="pin-price active">$24,500</span>
  <span class="pin-price">$32,000</span>
  <span class="pin-price">$18,200</span>
  <span class="pin-cluster">14</span>
  <span class="lbl" style="margin-left:14px">POI</span>
  <span class="pin-poi" style="background: var(--ab-jade-600)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L13 8 L19 8 L14 12 L16 19 L12 15 L8 19 L10 12 L5 8 L11 8 Z"/></svg>
  </span>
  <span class="pin-poi" style="background: #F58025">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><text x="12" y="17" text-anchor="middle" font-family="Inter" font-size="14" font-weight="900" fill="currentColor" stroke="none">M</text></svg>
  </span>
  <span class="pin-poi" style="background: var(--ab-ochre-500)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21 V8 L12 3 L21 8 V21 Z"/><path d="M9 21 V14 H15 V21"/></svg>
  </span>
</div>
</body></html>
