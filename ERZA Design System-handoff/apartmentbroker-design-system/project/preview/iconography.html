<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); color: var(--ab-ink-900); }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 14px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap: 6px; padding: 10px 4px; background: #FFFFFF; border-radius: var(--ab-radius-md); border: 1px solid var(--ab-border); }
  .ic svg { width: 22px; height: 22px; }
  .ic span { font-size: 10px; color: var(--ab-stone-600); text-align:center; }
  .ic img { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="grid">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 V8 L12 3 L21 8 V21 Z"/><path d="M9 21 V14 H15 V21"/></svg><span>home</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>search</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>map-pin</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18 M8 3v4 M16 3v4"/></svg><span>calendar</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 H4 M4 12 l6-6 M4 12 l6 6"/></svg><span>arrow</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.6a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.07a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.85a5.5 5.5 0 0 0 0-7.78Z"/></svg><span>save</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18 M6 7l1 13h10l1-13 M9 7V4h6v3"/></svg><span>delete</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"/></svg><span>plus</span></div>
  <div class="ic"><img src="../assets/icon-360.svg"><span>360°</span></div>
  <div class="ic"><img src="../assets/icon-3d-room.svg"><span>3D room</span></div>
  <div class="ic"><img src="../assets/icon-metro.svg"><span>metro</span></div>
  <div class="ic"><img src="../assets/icon-metrobus.svg"><span>metrobús</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>clock</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/></svg><span>user</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span>chevron</span></div>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18 M3 12h18 M3 18h18"/></svg><span>filter</span></div>
</div>
</body></html>
