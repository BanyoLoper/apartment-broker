<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Mono & eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .row { display:grid; grid-template-columns: 110px 1fr; gap: 10px 24px; align-items: baseline; }
  .meta { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); }
  .price { font: var(--ab-text-mono); font-size: 22px; color: var(--ab-ink-900); }
  .stat { font: var(--ab-text-mono); font-size: 14px; color: var(--ab-stone-600); }
</style>
</head>
<body>
<div class="row">
  <span class="meta">Eyebrow</span><span class="ab-eyebrow">Disponible · Roma Norte</span>
  <span class="meta">Mono · Price</span><span class="price">MXN $24,500 / mes</span>
  <span class="meta">Mono · Stats</span><span class="stat">2 rec · 1 baño · 78 m² · piso 3</span>
  <span class="meta">Mono · Coords</span><span class="stat">19.4194° N, 99.1605° W</span>
</div>
</body></html>
