<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ezra-ink-900); font-family: var(--ezra-font-body); padding: 18px; min-height: 100vh; }
  .card { position: relative; aspect-ratio: 4/5; max-width: 320px; border-radius: 4px; overflow: hidden; box-shadow: 0 12px 32px -16px rgba(0,0,0,0.5); background: linear-gradient(135deg, #4a4543 0%, #2a2725 100%); }
  .scrim { position:absolute; inset:0; background: linear-gradient(to bottom, rgba(20,20,20,0.72) 0%, rgba(20,20,20,0.45) 28%, rgba(20,20,20,0.10) 50%, rgba(20,20,20,0.0) 70%, rgba(20,20,20,0.32) 100%); }
  .stack-icon { position:absolute; top:14px; right:14px; opacity: 0.85; }
  .copy { position:absolute; left:22px; right:22px; top:22px; color: #FFF; font-family: 'Inter', sans-serif; }
  .eyebrow { font-size: 13px; font-weight: 300; opacity: 0.92; margin: 0 0 6px; }
  .name { font-size: 26px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.0; margin: 0; }
  .specs { margin: 14px 0 0; font-size: 15px; font-weight: 300; line-height: 1.3; }
  .specs strong { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .specs .dot { margin: 0 6px; opacity: 0.45; }
  .price { margin: 16px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .price .lbl { font-weight: 300; margin-right: 8px; }
  .note { margin: 6px 0 0; font-size: 12px; font-weight: 300; opacity: 0.7; }
  .water { position:absolute; left: 0; right: 0; bottom: 22px; text-align: center; pointer-events: none; }
  .water .w { font-family: 'Playfair Display', serif; font-size: 24px; letter-spacing: 6px; color: rgba(255,255,255,0.55); font-weight: 400; }
  .water .sub { display:block; font-size: 7px; letter-spacing: 3px; font-weight: 300; margin-top: 3px; color: rgba(255,255,255,0.42); }
</style></head><body>
<article class="card">
  <div class="scrim"></div>
  <svg class="stack-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="14" height="14" rx="1"/><path d="M16 18v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/></svg>
  <div class="copy">
    <p class="eyebrow">80 m² interiores · 25 m² terraza</p>
    <h3 class="name">Penthouse +<br/>roof privado</h3>
    <p class="specs"><strong>105 m²</strong><span class="dot">·</span>3 rec · 2.5 baños · 2 estac</p>
    <p class="price"><span class="lbl">Renta</span>$25,000</p>
    <p class="note">mtto. incluido ($3,000)</p>
  </div>
  <div class="water"><div class="w">EZRA</div><span class="sub">REAL ESTATE</span></div>
</article>
</body></html>
