<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Imagery</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 16px; font-family: var(--ab-font-body); }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ph { aspect-ratio: 4/3; border-radius: var(--ab-radius-md); background-size: cover; background-position: center; box-shadow: var(--ab-shadow-inset); }
</style>
</head>
<body>
<div class="row">
  <div class="ph" style="background-image: url(../assets/placeholder-apt-1.svg)"></div>
  <div class="ph" style="background-image: url(../assets/placeholder-apt-2.svg)"></div>
  <div class="ph" style="background-image: url(../assets/placeholder-apt-3.svg)"></div>
  <div class="ph" style="background-image: url(../assets/placeholder-apt-4.svg)"></div>
  <div class="ph" style="background-image: url(../assets/placeholder-apt-5.svg)"></div>
</div>
</body></html>
