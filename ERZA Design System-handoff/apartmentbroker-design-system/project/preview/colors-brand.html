<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ezra-ink-950); padding: 18px; font-family: var(--ezra-font-body); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: 4px; height: 110px; padding: 12px; display:flex; flex-direction:column; justify-content: space-between; border: 1px solid rgba(255,255,255,0.08); }
  .sw .name { font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform:uppercase; }
  .sw .hex { font: var(--ezra-text-mono); font-size: 11px; opacity: 0.8; }
  .dark { color: #FFFFFF; }
  .light { color: #141414; }
</style></head><body>
<div class="row">
  <div class="sw dark" style="background:#0A0A0A"><span class="name">Ink 950</span><span class="hex">0A0A0A</span></div>
  <div class="sw dark" style="background:#141414"><span class="name">Ink 900 · primary</span><span class="hex">141414</span></div>
  <div class="sw dark" style="background:#1F1F1F"><span class="name">Ink 800</span><span class="hex">1F1F1F</span></div>
  <div class="sw dark" style="background:#3D3D3D"><span class="name">Stone 700</span><span class="hex">3D3D3D</span></div>
  <div class="sw dark" style="background:#6E6E6E"><span class="name">Stone 500</span><span class="hex">6E6E6E</span></div>
  <div class="sw light" style="background:#B5B0AC"><span class="name">Stone 300</span><span class="hex">B5B0AC</span></div>
  <div class="sw light" style="background:#FFFFFF"><span class="name">White · accent</span><span class="hex">FFFFFF</span></div>
</div>
</body></html>
