<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ezra-ink-900); padding: 32px; font-family: var(--ezra-font-body); color: #FFF; }
  .stack { display:flex; flex-direction:column; gap: 4px; }
  .meta { font-size: 11px; font-weight: 300; letter-spacing: 0.18em; text-transform:uppercase; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
  .display { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.02em; line-height: 1; color: #FFF; }
  .display .thin { font-weight: 200; }
  .wordmark { font-family: 'Playfair Display', serif; font-size: 56px; font-weight: 400; letter-spacing: 8px; color: #FFF; }
  .small-caps { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 5px; color: rgba(255,255,255,0.55); margin-top: 6px; }
</style></head><body>
<div class="stack">
  <span class="meta">Display · Inter 800 + 200, mixed</span>
  <span class="display"><span class="thin">Vivienda </span>curada<span class="thin"> en </span>CDMX.</span>
  <div style="height: 28px"></div>
  <span class="meta">Wordmark · Playfair Display 400 · tracking 8px</span>
  <span class="wordmark">EZRA</span>
  <span class="small-caps">REAL ESTATE</span>
</div>
</body></html>
