<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .b { background: #FFFFFF; border: 1px solid var(--ab-border); height: 100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 6px; }
  .lbl { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); }
  .px { font: var(--ab-text-mono); font-size: 12px; color: var(--ab-ink-900); }
</style>
</head>
<body>
<div class="row">
  <div class="b" style="border-radius:4px"><span class="lbl">sm</span><span class="px">4 px</span></div>
  <div class="b" style="border-radius:8px"><span class="lbl">md</span><span class="px">8 px</span></div>
  <div class="b" style="border-radius:14px"><span class="lbl">lg</span><span class="px">14 px</span></div>
  <div class="b" style="border-radius:22px"><span class="lbl">xl</span><span class="px">22 px</span></div>
  <div class="b" style="border-radius:999px"><span class="lbl">pill</span><span class="px">999 px</span></div>
</div>
</body></html>
