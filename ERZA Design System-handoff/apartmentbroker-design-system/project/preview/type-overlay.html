<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ezra-ink-900); padding: 28px; font-family: 'Inter', sans-serif; color: #FFF; }
  .meta { font-size: 11px; font-weight: 300; letter-spacing: 0.18em; text-transform:uppercase; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
  .name { font-weight: 800; font-size: 30px; letter-spacing: -0.015em; line-height: 1.0; margin: 0; }
  .specs { font-size: 16px; line-height: 1.3; margin: 14px 0 0; font-weight: 300; }
  .specs strong { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
  .price { margin: 16px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .price .lbl { font-weight: 300; margin-right: 10px; }
  .note { margin: 8px 0 0; font-size: 13px; font-weight: 300; opacity: 0.7; }
</style></head><body>
<div class="meta">Editorial overlay · bold + thin white only</div>
<h1 class="name">Penthouse + roof privado</h1>
<p class="specs"><strong>105 m²</strong> <span style="opacity:0.45;margin:0 6px">·</span>3 rec · 2.5 baños · 2 estac · amenidades</p>
<p class="price"><span class="lbl">Renta</span>$25,000</p>
<p class="note">mtto. incluido ($3,000)</p>
</body></html>
