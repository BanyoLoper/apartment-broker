<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); font-family: var(--ab-font-body); padding: 18px; }
  .row { display:grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .sw { border-radius: var(--ab-radius-md); height: 96px; padding: 10px 8px; display:flex; flex-direction:column; justify-content: space-between; border: 1px solid rgba(22,20,15,0.06); }
  .sw .name { font: var(--ab-text-eyebrow); letter-spacing:0.1em; text-transform:uppercase; font-size: 9px; }
  .sw .hex { font: var(--ab-text-mono); font-size: 10px; }
  .sw.dark { color: #FAF7F2; }
  .sw.light { color: #16140F; }
</style>
</head>
<body>
<div class="row">
  <div class="sw light" style="background:#FAF7F2"><span class="name">Bone 50</span><span class="hex">FAF7F2</span></div>
  <div class="sw light" style="background:#F4EFE6"><span class="name">Bone 100</span><span class="hex">F4EFE6</span></div>
  <div class="sw light" style="background:#E8E1D3"><span class="name">Bone 200</span><span class="hex">E8E1D3</span></div>
  <div class="sw light" style="background:#C9C0AE"><span class="name">Bone 300</span><span class="hex">C9C0AE</span></div>
  <div class="sw dark" style="background:#8B8377"><span class="name">Stone 400</span><span class="hex">8B8377</span></div>
  <div class="sw dark" style="background:#5C564C"><span class="name">Stone 600</span><span class="hex">5C564C</span></div>
  <div class="sw dark" style="background:#2A2722"><span class="name">Ink 800</span><span class="hex">2A2722</span></div>
  <div class="sw dark" style="background:#16140F"><span class="name">Ink 900</span><span class="hex">16140F</span></div>
</div>
</body></html>
