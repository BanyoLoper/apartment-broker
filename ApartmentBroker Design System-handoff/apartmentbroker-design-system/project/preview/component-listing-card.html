<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Listing card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 18px; font-family: var(--ab-font-body); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #FFFFFF; border: 1px solid var(--ab-border); border-radius: var(--ab-radius-lg); overflow: hidden; box-shadow: var(--ab-shadow-1); transition: box-shadow 180ms, transform 180ms; }
  .card:hover { box-shadow: var(--ab-shadow-2); transform: translateY(-1px); }
  .photo { aspect-ratio: 16 / 9; background-size: cover; background-position: center; position: relative; }
  .badges { position:absolute; top:10px; left:10px; display:flex; gap:6px; }
  .badge { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 999px; font: var(--ab-text-caption); font-weight: 600; color: var(--ab-ink-900); }
  .badge.primary { background: var(--ab-terracotta-500); color: #FFFFFF; }
  .body { padding: 12px 14px; }
  .name { font: var(--ab-text-h4); color: var(--ab-ink-900); margin: 0 0 2px; }
  .loc { font: var(--ab-text-caption); color: var(--ab-stone-600); }
  .row2 { display:flex; justify-content: space-between; margin-top: 8px; align-items: baseline; }
  .price { font-family: var(--ab-font-mono); font-size: 14px; font-weight: 500; color: var(--ab-ink-900); }
  .stats { font: var(--ab-text-caption); color: var(--ab-stone-600); }
</style>
</head>
<body>
<div class="row">
  <div class="card">
    <div class="photo" style="background-image: url(../assets/placeholder-apt-1.svg)">
      <div class="badges"><span class="badge primary">3D</span><span class="badge">360°</span></div>
    </div>
    <div class="body">
      <h3 class="name">Casa Sonora</h3>
      <div class="loc">Roma Norte · piso 3</div>
      <div class="row2"><span class="price">MXN $24,500 / mes</span><span class="stats">2 rec · 78 m²</span></div>
    </div>
  </div>
  <div class="card">
    <div class="photo" style="background-image: url(../assets/placeholder-apt-2.svg)">
      <div class="badges"><span class="badge">Disponible</span></div>
    </div>
    <div class="body">
      <h3 class="name">Roof Álvaro Obregón</h3>
      <div class="loc">Condesa · terraza privada</div>
      <div class="row2"><span class="price">MXN $32,000 / mes</span><span class="stats">1 rec · 64 m²</span></div>
    </div>
  </div>
</div>
</body></html>
