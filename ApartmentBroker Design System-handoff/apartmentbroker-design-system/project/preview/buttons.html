<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .row { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 12px; }
  button { font-family: inherit; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: all 140ms cubic-bezier(0.2,0.7,0.2,1); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 8px; }
  .primary { background: var(--ab-terracotta-500); color: #FFFFFF; }
  .primary:hover { background: var(--ab-terracotta-600); }
  .secondary { background: #FFFFFF; color: var(--ab-ink-900); border-color: var(--ab-border-strong); }
  .secondary:hover { background: var(--ab-bone-100); }
  .ghost { background: transparent; color: var(--ab-ink-900); }
  .ghost:hover { background: var(--ab-bone-100); }
  .danger { background: var(--ab-danger); color: #FFFFFF; }
  .pill { border-radius: 999px; padding: 8px 14px; font-size: 13px; }
  .icon { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="row">
  <button class="primary">Reservar visita</button>
  <button class="secondary">Ver en 3D</button>
  <button class="ghost">Cancelar</button>
  <button class="danger">Retirar</button>
</div>
<div class="row">
  <button class="primary pill">Disponible ahora</button>
  <button class="secondary pill">Filtros</button>
  <button class="primary" disabled style="opacity:0.45;cursor:not-allowed">Reservada</button>
</div>
</body></html>
