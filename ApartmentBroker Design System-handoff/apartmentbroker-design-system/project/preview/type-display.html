<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>

  .meta { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); }

</head>
<body>
<div class="stack">
  <span class="meta">Display 1 · Fraunces 600 · 72/1.02 · −0.02em</span>

  <span class="meta" style="margin-top:6px">Display 2 · Fraunces 500 · 56/1.05 · −0.015em</span>
