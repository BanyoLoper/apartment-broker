<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); font-family: var(--ab-font-body); padding: 18px; }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--ab-radius-md); height: 96px; padding: 12px; display:flex; flex-direction:column; justify-content: space-between; box-shadow: var(--ab-shadow-1); position: relative; overflow: hidden; }
  .sw .name { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; }
  .sw .hex { font: var(--ab-text-mono); font-size: 11px; }
  .sw.dark { color: #FAF7F2; }
  .sw.light { color: #16140F; }
</style>
</head>
<body>
<div class="row">
  <div class="sw dark" style="background:#C8553D"><span class="name">Terracotta</span><span class="hex">#C8553D · 500</span></div>
  <div class="sw dark" style="background:#A8432F"><span class="name">Terracotta P</span><span class="hex">#A8432F · 600</span></div>
  <div class="sw light" style="background:#E8A6A0"><span class="name">Rosa</span><span class="hex">#E8A6A0 · 500</span></div>
  <div class="sw dark" style="background:#2F6B5E"><span class="name">Jade</span><span class="hex">#2F6B5E · 600</span></div>
  <div class="sw light" style="background:#D9A441"><span class="name">Ochre</span><span class="hex">#D9A441 · 500</span></div>
</div>
</body></html>
