<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Body type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--ab-bg); padding: 22px; font-family: var(--ab-font-body); }
  .grid { display:grid; grid-template-columns: 110px 1fr; gap: 8px 24px; align-items: baseline; }
  .meta { font: var(--ab-text-eyebrow); letter-spacing:0.14em; text-transform:uppercase; color: var(--ab-fg-soft); }
</style>
</head>
<body>
<div class="grid">
  <span class="meta">H1</span><span class="ab-h1">Departamentos curados</span>
  <span class="meta">H2</span><span class="ab-h2">Roma Norte · 12 listings</span>
  <span class="meta">H3</span><span class="ab-h3">Casa Sonora — piso 3</span>
  <span class="meta">Body</span><span class="ab-body">Departamento luminoso de 78 m² con dos recámaras, balcón a la calle.</span>
  <span class="meta">Caption</span><span class="ab-caption">Última actualización hace 2 horas</span>
</div>
</body></html>
